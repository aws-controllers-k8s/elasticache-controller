# Replication group attached to a user group for testing userGroupIDs updates
apiVersion: elasticache.services.k8s.aws/v1alpha1
kind: ReplicationGroup
metadata:
  name: $RG_ID
spec:
  cacheNodeType: cache.t3.micro
  engine: redis
  engineVersion: "7.1"
  numNodeGroups: 1
  replicasPerNodeGroup: 0
  transitEncryptionEnabled: true
  userGroupIDs:
    - $USERGROUP_ID
  description: user group test RG
  replicationGroupID: $RG_ID
