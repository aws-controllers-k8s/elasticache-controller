# Primary replication group for GlobalReplicationGroup E2E tests.
#
# Global Datastore requires large-and-above M/R/C-family node types (T-family
# and anything smaller than "large" is rejected by CreateGlobalReplicationGroup)
# and automatic failover enabled on the primary. See:
# https://docs.aws.amazon.com/AmazonElastiCache/latest/dg/Redis-Global-Datastores-Getting-Started.html
#
# Forked from replicationgroup_create_delete.yaml so these GRG-specific
# requirements don't change what test_replicationgroup.py provisions.
apiVersion: elasticache.services.k8s.aws/v1alpha1
kind: ReplicationGroup
metadata:
  name: $RG_ID
spec:
  cacheNodeType: cache.r6g.large
  engine: redis
  engineVersion: "$ENGINE_VERSION"
  numNodeGroups: $NUM_NODE_GROUPS
  replicasPerNodeGroup: $REPLICAS_PER_NODE_GROUP
  automaticFailoverEnabled: true
  description: cluster-mode disabled RG
  replicationGroupID: $RG_ID
